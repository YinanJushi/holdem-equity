<body class="rl">
<header class="top">
  <a class="brand" href="index.html"><span class="mark">♠</span>Odds Lounge</a>
  <div class="top-right">
  <nav class="games" aria-label="Games">
    <a href="index.html">Texas Hold'em</a>
    <a href="blackjack.html">Blackjack</a>
    <a href="roulette.html" class="on" aria-current="page">Roulette</a>
    <a href="slots.html">Slots</a>
    <a href="pusher.html">Coin Pusher</a>
    <a href="stats.html">Stats</a>
  </nav>
  <div id="wallet" class="wallet"></div>
  <button id="soundBtn" class="iconbtn" aria-pressed="true">Sound on</button>
  </div>
</header>

<main class="layout">
  <section class="left">
    <div class="toolbar"><button class="linkbtn" id="fsBtn">Full screen</button></div>
    <div class="table" id="table"><div class="msg" id="msg">Place your chips, then Spin.</div></div>
    <div id="rlBar" class="betbar rl-bar">
      <div class="chip-row" id="rlChips">
        <button class="bigchip" data-chip="5">5</button>
        <button class="bigchip blue" data-chip="25">25</button>
        <button class="bigchip black" data-chip="100">100</button>
        <button class="bigchip gold" data-chip="500">500</button>
      </div>
      <span class="rl-total">Bet <b id="rlTotal">0</b></span>
      <div class="bb-foot">
        <button id="rlUndo" class="ghostbtn">Undo</button>
        <button id="rlClear" class="ghostbtn">Clear</button>
        <button id="rlRebet" class="ghostbtn">Rebet</button>
        <button id="rlSpin" class="primary">Spin</button>
      </div>
    </div>
    <div id="session" class="session"></div>
  </section>
</main>

<footer class="foot">For fun with play chips only. Single zero: the house edge is 2.7%.</footer>
